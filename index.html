<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ostrich Rescue Program</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <svg class="leaf" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 4C9 4 4 9 4 15c0 1.6.4 3 1.2 4.2C6.5 14.5 10 11 15 9c-4 3-6.5 6.500-7.6 11 1.1.6 2.4 1 3.6 1 6 0 9-5 9-17z" fill="currentColor"/></svg>
    <span>Ostrich Rescue Program</span>
  </header>

  <main>
    <section id="loader" class="card" aria-live="polite">
      <div id="spinner" class="spinner" aria-hidden="true"></div>
      <svg id="check" class="check hidden" viewBox="0 0 52 52" aria-hidden="true">
        <circle cx="26" cy="26" r="24" fill="none" stroke="currentColor" stroke-width="3"/>
        <path d="M14 27l8 8 16-17" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <p id="loader-text">Getting user location</p>
    </section>

    <section id="result" class="card hidden">
      <img id="ostrich" src="ostrich.jpg" width="864" height="1152" alt="A very real ostrich on its way to you">
      <p>Thank you for participating in the free ostrich rescue program! Your live ostrich is on its way to your home address right now! There is nothing extra you need to do to arrange the delivery.</p>
    </section>
  </main>

  <footer class="site-footer">Protecting wildlife, one ostrich at a time.</footer>
  <script src="script.js"></script>
</body>
</html>
